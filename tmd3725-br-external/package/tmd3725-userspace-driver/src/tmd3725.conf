# Configuration for the TMD3725 userspace driver
# Should be noted that changing these values requires understanding the 
# underlying sensor hardware and the application logic

# I2C bus device node
I2C_BUS=/dev/i2c-1

# ALS
ATIME=0x3F
CFG0=0x80

# Proximity
PRATE=0x1F
PCFG0=0x4F
PCFG1=0x4D

# WTIME and Polling
WTIME=179
POLL_TIME_US=300000

# PDATA detection and release thresholds
DETECTION_THRESH=60
EMPTY_THRESH=30
