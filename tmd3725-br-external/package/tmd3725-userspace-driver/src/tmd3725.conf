# Configuration for the TMD3725 userspace driver
# Note: The main.c:load_configuration() function does not validate the parameter values.
# Parameters should be modified with understanding of the underlying hardware and application logic.

# I2C bus device node
I2C_BUS=/dev/i2c-1

# ALS
ATIME=0x3F

# Proximity
PRATE=0x1F
PCFG0=0x4F  #PPULSE_LEN, PPULSE
PCFG1=0x4D  #PGAIN, PLDRIVE

# WTIME and Polling
WTIME=0x59
CFG0=0x80 #WLONG
POLL_TIME_US=400000

# PDATA detection and release thresholds
DETECTION_THRESH=60
EMPTY_THRESH=30
